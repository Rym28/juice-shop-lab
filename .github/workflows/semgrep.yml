name: Semgrep SAST

on:
  push:
    branches: [ "semgrep" ]

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6.1.0

      - name: Install Semgrep
        run: |
          pip install pipx
          pipx install semgrep
          pipx ensurepath
          source ~/.bashrc

      - name: Run Semgrep
        run: semgrep --config=auto --config=semgrep-rules --error .

