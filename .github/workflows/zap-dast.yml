name: DAST with OWASP ZAP Baseline Scan

on:
  push:
    branches:
      - zap
  workflow_dispatch:

jobs:
  dast:
    runs-on: ubuntu-latest

    steps:
      # this step only added to add access to some files in OWASP ZAP
      - name: Fix permissions for ZAP
        run: sudo chown -R 1000:1000 .

      - name: Run OWASP ZAP Baseline Scan
        # OWASP ZAP baseline scan
        run: |
          docker run -t -v $(pwd):/zap/wrk ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py -t http://98.90.197.242:3000/ -r zap-baseline.html -I

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-baseline-report
          path: zap-baseline.html
